name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release-build:
    name: Test and build release distributions
    runs-on: ubuntu-latest

    steps:
      - name: Check out the released tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          enable-cache: true

      - name: Check version matches release tag
        run: |
          test \
            "$(grep -oP '(?<=version = ")[^"]*' pyproject.toml)" \
            = \
            "${{ github.event.release.tag_name }}"

      - name: Run tests
        run: uv run --locked pytest

      - name: Build distributions
        run: uv build --out-dir dist

      - name: Upload release distributions
        uses: actions/upload-artifact@v7
        with:
          name: release-dists
          path: dist/
          if-no-files-found: error
          retention-days: 7

  pypi-publish:
    name: Publish to PyPI
    needs: release-build
    runs-on: ubuntu-latest

    permissions:
      id-token: write

    environment:
      name: pypi
      url: https://pypi.org/project/nwn/

    steps:
      - name: Download release distributions
        uses: actions/download-artifact@v8
        with:
          name: release-dists
          path: dist/

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4

      - name: Publish distributions through Trusted Publishing
        run: uv publish --trusted-publishing always dist/*
